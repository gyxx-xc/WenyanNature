plugins {
    id 'java'
    id 'antlr' // for client lexer only
    id 'idea' // for JUnit
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "lol.bai"
            includeGroup "mcp.mobius.waila"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = mod_id
}

version = mod_version
group = mod_group_id

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'

            exclude("**/*.bbmodel") // BlockBench project files
            exclude("src/generated/**/.cache") // datagen cache files
            exclude("src/main/resources/assets/wenyan_programming/textures/item/legacy") // legacy item textures
        }
    }
    client {
        resources {
            exclude("**/*.bbmodel") // BlockBench project files
            exclude("src/generated/**/.cache") // datagen cache files
        }

        runtimeClasspath += main.output
        compileClasspath += main.output
    }
    gameTest {
        runtimeClasspath += main.output
        compileClasspath += main.output
        runtimeClasspath += client.output
        compileClasspath += client.output
    }
}

neoForge {
    enable {
        version = neo_version
        enabledSourceSets = sourceSets // All source sets use Minecraft code
    }

    addModdingDependenciesTo sourceSets.client

    mods {
        wenyan_programming {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
        wenyanTest {
            sourceSet(sourceSets.gameTest)
        }
    }

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            loadedMods = [mods.wenyan_programming]
            // logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()

            sourceSet = sourceSets.client
        }

        directWorld {
            client()
            programArguments = [
                    // create this world by your self
                    '--username', 'WenyanDev', '--quickPlaySingleplayer', 'GametestWorld'
            ]
            sourceSet = sourceSets.client
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            loadedMods.add(mods.wenyanTest)
        }

        gameTestWClient {
            client()
            sourceSet = sourceSets.gameTest
            loadedMods.add(mods.wenyanTest)
        }

        clientData {
            clientData()
//            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            programArguments = [
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            ]
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    localRuntimeOnly
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // jarJar
    jarJar implementation(project(":judou"))
    // lib from judou
    jarJar implementation("org.antlr:antlr4-runtime:4.13.1")
    jarJar implementation("com.github.houbb:opencc4j:1.14.0")
    jarJar implementation("com.github.houbb:nlp-common:0.0.5")
    jarJar implementation("com.github.houbb:heaven:0.13.0")

    // judou
    implementation project(":judou")
    clientImplementation(project(":judou")) // for code highlight
    antlr("org.antlr:antlr4:4.13.1") // for grammar lexer version

    // for annotation processor
    compileOnly project(":language_processor")
    annotationProcessor project(":language_processor")
    clientCompileOnly project(":language_processor")
    clientAnnotationProcessor project(":language_processor")

    // mod requirements
//    implementation "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"
//    compileOnly "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE:api"
//    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE"

    clientCompileOnly "mezz.jei:jei-${project.jei_minecraft_version}-neoforge-api:${project.jei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
//    clientCompileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"

//    compileOnly "mcp.mobius.waila:wthit-api:neo-${project.wthit_version}"
//    compileOnly "maven.modrinth:jade:${project.jade_version}+neoforge"

    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    clientCompileOnly("org.projectlombok:lombok:1.18.42")
    clientAnnotationProcessor("org.projectlombok:lombok:1.18.42")

    // copy from https://github.com/AppliedEnergistics/Applied-Energistics-2/blob/main/build.gradle
    testImplementation(platform("org.junit:junit-bom:6.0.2"))
    testImplementation(platform("org.assertj:assertj-bom:3.27.6"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("org.junit.platform:junit-platform-launcher")
    testImplementation("org.assertj:assertj-core")
    testImplementation("com.google.guava:guava-testlib:21.0")
    testImplementation("net.neoforged:testframework:${neo_version}")

    // for game test
    gameTestImplementation(project(":judou"))
    gameTestImplementation("net.neoforged:testframework:${neo_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(sourceSets.client.output)
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = layout.projectDirectory.dir("repo") }
    }
}

// copy from https://github.com/junit-team/junit-examples/blob/r6.0.2/junit-jupiter-starter-gradle/build.gradle
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

generateClientGrammarSource {
    arguments += [
            "-encoding", "UTF-8",
            "-package", "indi.wenyan.client.antlr"
    ]
    outputDirectory = layout.buildDirectory
            .dir("generated-src/antlr/client/indi/wenyan/client/antlr")
            .get()
            .asFile
}
