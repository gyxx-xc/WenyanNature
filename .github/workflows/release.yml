name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to validate, for example v1.0.0 (manual runs do not publish)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Datagen, build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must start with v and contain a version, for example v1.0.0."
            exit 1
          fi

          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [[ -z "$MOD_VERSION" ]]; then
            echo "::error::mod_version is missing from gradle.properties."
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$TAG_VERSION" != "$MOD_VERSION" ]]; then
            echo "::error::Tag version '$TAG_VERSION' does not match mod_version '$MOD_VERSION'."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=wenyan_programming-$MOD_VERSION.jar" >> "$GITHUB_OUTPUT"

      - name: Run data generation
        run: ./gradlew runClientData

      - name: Verify generated resources are committed
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain --untracked-files=all -- src/generated/resources)"
          if [[ -n "$CHANGES" ]]; then
            echo "::error::Datagen changed src/generated/resources. Run './gradlew runClientData' locally and commit the generated files before releasing."
            echo "$CHANGES"
            exit 1
          fi

      - name: Build release Jar
        run: ./gradlew build

      - name: Collect and verify release Jar
        env:
          JAR_NAME: ${{ steps.version.outputs.jar_name }}
        run: |
          set -euo pipefail

          JAR_PATH="build/libs/$JAR_NAME"
          if [[ ! -f "$JAR_PATH" ]]; then
            echo "::error::Expected release Jar '$JAR_PATH' was not produced."
            find build/libs -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi

          JAR_ENTRIES="$(jar tf "$JAR_PATH")"
          for REQUIRED_PATH in \
            "assets/wenyan_programming/lang/" \
            "data/wenyan_programming/recipe/" \
            "data/wenyan_programming/advancement/"; do
            if ! grep -Fq "$REQUIRED_PATH" <<< "$JAR_ENTRIES"; then
              echo "::error::Release Jar is missing generated resources under '$REQUIRED_PATH'."
              exit 1
            fi
          done

          mkdir -p dist
          cp "$JAR_PATH" "dist/$JAR_NAME"
          sha256sum "dist/$JAR_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.jar_name }}
          path: dist/${{ steps.version.outputs.jar_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          JAR_NAME: ${{ steps.version.outputs.jar_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$JAR_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
